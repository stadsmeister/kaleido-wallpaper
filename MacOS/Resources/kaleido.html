<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kaleido Wallpaper</title>
<style>
  html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: #000; }
  canvas { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
  #err { position: fixed; inset: 0; display: none; place-items: center; color: #fff; font: 14px system-ui; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="err"></div>
<script>
// Kaleidoscope live wallpaper. Rendering is identical to the "Caleidoscoop" mode of the visualizer;
// the audio spectrum is pushed in by the macOS app (window.psyFeed). Open with ?demo to preview in a browser.
(() => {
'use strict';
const $ = id => document.getElementById(id);
const canvas = $('c');
const S = { sens: 1.2, trail: 0.72, ringSpeed: 1, maxFps: 60, scale: 0.6, react: 2.2, bounce: 1, beatColor: false, vibrancy: 0.6, custom: null };
// custom: null = album colours (or rainbow without a cover); [[r,g,b] ×4] (0…1) = the user's own colours
// react: attack speed multiplier; bounce: strength of the visual kick on sudden hits (0 = off)

// ---------- WebGL setup ----------
const gl = canvas.getContext('webgl', { antialias: false, alpha: false, premultipliedAlpha: false });
if (!gl) {
  $('err').style.display = 'grid';
  $('err').textContent = 'Je browser ondersteunt geen WebGL. Probeer een recente versie van Chrome, Edge of Firefox.';
  return;
}

const VS = `
attribute vec2 a_pos;
varying vec2 v_uv;
void main() {
  v_uv = a_pos * 0.5 + 0.5;
  gl_Position = vec4(a_pos, 0.0, 1.0);
}`;

const SCENE_FS = `
precision highp float;
varying vec2 v_uv;
uniform sampler2D u_prev;
uniform sampler2D u_audio;
uniform vec2  u_res;
uniform float u_time, u_bass, u_mid, u_high, u_beat, u_vol, u_mode, u_hue, u_feedback;
// one entry per EQ band / ring: 31, 63, 125, 250, 500, 1k, 2k, 4k, 8k, 16k Hz
uniform float u_ringAng[10];
uniform float u_ringE[10];
uniform vec3 u_palC[4];     // album cover colours (album art mode)
uniform float u_palMix;     // 0 = rainbow palette, 1 = album colours
uniform float u_vivid;      // album colour vibrancy (0 = natural … 1 = max), already faded with u_palMix

const float TAU = 6.28318530718;

mat2 rot(float a) { float c = cos(a), s = sin(a); return mat2(c, -s, s, c); }
vec3 albumPal(float t) {
  float x = fract(t) * 4.0, f = smoothstep(0.0, 1.0, fract(x));
  vec3 a, b;
  if (x < 1.0)      { a = u_palC[0]; b = u_palC[1]; }
  else if (x < 2.0) { a = u_palC[1]; b = u_palC[2]; }
  else if (x < 3.0) { a = u_palC[2]; b = u_palC[3]; }
  else              { a = u_palC[3]; b = u_palC[0]; }
  return mix(a, b, f);
}
vec3 pal(float t) {
  vec3 c = 0.5 + 0.5 * cos(TAU * (t + vec3(0.0, 0.33, 0.67)));
  return u_palMix > 0.001 ? mix(c, albumPal(t), u_palMix) : c;
}
float fft(float x)  { return texture2D(u_audio, vec2(clamp(x, 0.0, 1.0), 0.25)).r; }
float wave(float x) { return texture2D(u_audio, vec2(fract(x), 0.75)).r * 2.0 - 1.0; }

vec3 hueShift(vec3 c, float h) {
  const vec3 k = vec3(0.57735);
  float ca = cos(h);
  return c * ca + cross(k, c) * sin(h) + k * dot(k, c) * (1.0 - ca);
}

vec2 kaleido(vec2 p, float n) {
  float a = atan(p.y, p.x), r = length(p), s = TAU / n;
  a = mod(a, s);
  a = abs(a - s * 0.5);
  return vec2(cos(a), sin(a)) * r;
}

// 0: kaleidoscope of 10 concentric rings, each spinning on its own EQ band.
//    Motifs cycle per ring: flower petals, cut crystals, stars/snowflakes.
const float RW = 0.205;   // ring width

float ringCenter(float fi) { return fi < 0.5 ? 0.0 : 0.05 + RW * (fi + 0.5); }

// iq's 2D star SDF: n points, m controls how spiky (2 = polygon, n = very sharp)
float sdStar(vec2 p, float r, float n, float m) {
  float an = 3.141593 / n, en = 3.141593 / m;
  vec2 acs = vec2(cos(an), sin(an)), ecs = vec2(cos(en), sin(en));
  float bn = mod(atan(p.x, p.y), 2.0 * an) - an;
  p = length(p) * vec2(cos(bn), abs(sin(bn)));
  p -= r * acs;
  p += ecs * clamp(-dot(p, ecs), 0.0, r * acs.y / ecs.y);
  return length(p) * sign(p.x);
}

vec3 ringLayer(vec2 p, float r, float fi, float ang, float e) {
  float isCenter = step(fi, 0.5);
  float rc = ringCenter(fi);
  // mirror segments: keep each cell roughly square, always an even count (true mirror symmetry)
  float N = isCenter > 0.5 ? 8.0 : 2.0 * floor(clamp(TAU * rc / (RW * 3.0) + 0.5, 3.0, 16.0));
  float s = TAU / N;
  vec2 q = rot(ang) * p;
  float a = atan(q.y, q.x);
  float la  = mod(a, s) - 0.5 * s;              // signed angle inside a segment
  float la2 = mod(a + 0.5 * s, s) - 0.5 * s;    // same, shifted half a segment
  float rr = max(r, 0.001);
  float x = r - rc;                             // radial offset from ring centre
  float arc = s * max(rc, 0.15);                // segment width along the ring
  float motif = isCenter > 0.5 ? 0.0 : mod(fi, 3.0);

  vec3 cA = pal(fi * 0.11 + u_hue);
  vec3 cB = pal(fi * 0.11 + u_hue + 0.33);
  vec3 cC = pal(fi * 0.11 + u_hue + 0.66);
  float glow = 0.35 + 1.1 * e;
  vec3 col = vec3(0.0);

  if (motif < 0.5) {
    // ---- FLOWER: two layers of almond-shaped petals that bloom with the band
    float base = isCenter > 0.5 ? 0.0 : rc - 0.6 * RW;
    float len  = (isCenter > 0.5 ? 0.4 : 1.25 * RW) * (0.75 + 0.45 * e);
    for (int L = 0; L < 2; L++) {
      float back = L == 0 ? 1.0 : 0.0;
      float ll = back > 0.5 ? la2 : la;
      float pl = len * (back > 0.5 ? 1.12 : 1.0);
      float xp = r - base;
      float t = clamp(xp / pl, 0.0, 1.0);
      float wmax = 0.5 * s * (base + pl * 0.55) * (back > 0.5 ? 0.85 : 0.62) * (0.85 + 0.25 * e);
      float w = wmax * pow(sin(3.14159 * t), 0.6) * (1.0 - 0.55 * t);   // pointed tip
      float y = ll * rr;
      float d = max(abs(y) - w, max(-xp, xp - pl));
      float fill = smoothstep(0.006, -0.006, d);
      vec3 pc = mix(back > 0.5 ? cB * 0.5 : cA * 0.6, back > 0.5 ? cA : cC, smoothstep(0.0, 1.0, t));
      pc *= 0.75 + 0.25 * cos(abs(y) / max(w, 1e-3) * 3.14159);          // shading across the petal
      float vein = smoothstep(0.004, 0.0, abs(y)) * t;
      col = mix(col, pc * (0.3 + t * glow) + vein * 0.35 * glow, fill);
      col += smoothstep(0.008, 0.0, abs(d)) * cC * 0.45 * glow;
      float bead = smoothstep(0.02, 0.0, length(vec2(xp - pl * 1.1, y)) - 0.01 * (0.5 + e));
      col += bead * mix(cC, vec3(1.0), 0.3) * glow * (1.0 - back);
    }
    if (isCenter > 0.5) col += mix(cC, vec3(1.0), 0.4) * smoothstep(0.05 + 0.05 * e, 0.0, r) * glow;

  } else if (motif < 1.5) {
    // ---- CRYSTAL: faceted diamonds with a moving light, plus small satellite gems
    vec2 Q = vec2(x, la * rr);
    float A = 0.5 * RW * (0.85 + 0.35 * e);
    float B = min(0.45 * arc, A);
    float aa = 0.004 / min(A, B);
    float d  = abs(Q.x) / A + abs(Q.y) / B - 1.0;
    float d2 = abs(Q.x) / A + abs(Q.y) / B - 0.45;
    float inside = smoothstep(aa, -aa, d);
    vec2 n = normalize(vec2(sign(Q.x) / A, sign(Q.y) / B));
    vec2 Ld = vec2(cos(u_time * 0.8 + fi), sin(u_time * 0.8 + fi));
    float lit = max(dot(n, Ld), 0.0);
    vec3 facet = mix(cA * 0.3, cC, lit) * (0.4 + glow * 0.8);
    facet = mix(facet, mix(cB, vec3(1.0), 0.25) * glow, smoothstep(aa, -aa, d2) * 0.6);
    float ridge = smoothstep(0.004, 0.0, min(abs(Q.x), abs(Q.y))) * inside;
    float rim = smoothstep(aa * 1.5, 0.0, abs(d)) + smoothstep(aa, 0.0, abs(d2)) * 0.6;
    col = facet * inside + (ridge * 0.6 + rim) * cC * glow + pow(lit, 24.0) * e * 1.5 * inside;
    // satellites sit right on the ring borders so neighbouring rings interlock
    vec2 S = vec2(abs(x) - 0.52 * RW, la2 * rr);
    float sd = abs(S.x) / (A * 0.38) + abs(S.y) / (B * 0.38) - 1.0;
    col = mix(col, cB * (0.5 + glow * 0.7), smoothstep(aa * 2.5, -aa * 2.5, sd));
    col += smoothstep(aa * 3.0, 0.0, abs(sd)) * cC * 0.6 * glow;

  } else {
    // ---- STAR / SNOWFLAKE: spiky 6-point stars with frost branches, counter-spinning
    vec2 Q = rot(-ang * 2.0 + u_time * 0.2) * vec2(x, la * rr);
    float R = min(0.5 * RW, 0.45 * arc) * (0.7 + 0.45 * e);
    float d = sdStar(Q, R, 6.0, 2.3 + 2.4 * e);
    float inside = smoothstep(0.005, -0.005, d);
    float k = clamp(-d / R, 0.0, 1.0);
    col = mix(cA, cC, k) * (0.3 + glow * (0.4 + k)) * inside;
    col += smoothstep(0.007, 0.0, abs(d)) * cC * glow;
    col += smoothstep(0.005, 0.0, abs(sdStar(Q, R * 0.5, 6.0, 3.0))) * cB * glow * inside;
    // snowflake spokes with side branches
    float m6 = mod(atan(Q.y, Q.x), 1.047198) - 0.523599;
    vec2 Qs = length(Q) * vec2(cos(m6), abs(sin(m6)));
    float spoke = smoothstep(0.003, 0.0, Qs.y) * step(Qs.x, R * 1.35);
    vec2 bq = Qs - vec2(R * 0.6, 0.0);
    float bt = clamp(dot(bq, vec2(0.5, 0.866)), 0.0, R * 0.45);
    float branch = smoothstep(0.004, 0.0, length(bq - bt * vec2(0.5, 0.866)));
    col += (spoke + branch) * mix(cC, vec3(1.0), 0.5) * glow * 0.7;
    // sparkles on the borders
    vec2 S = vec2(abs(x) - 0.5 * RW, la2 * rr);
    col += exp(-length(S) * 90.0) * mix(cB, vec3(1.0), 0.5) * glow * 1.5;
  }
  return col;
}

vec3 modeKaleido(vec2 p) {
  float r = length(p);
  // soft gaussian weights: every pixel is a blend of the 2-4 nearest rings,
  // so the motifs dissolve into each other instead of meeting at a hard edge
  vec3 acc = vec3(0.0);
  float wsum = 0.0;
  for (int i = 0; i < 10; i++) {
    float fi = float(i);
    float sig = i == 0 ? 0.2 : 0.15;
    float dz = (r - ringCenter(fi)) / sig;
    if (i == 9) dz = min(dz, 0.0);           // outermost ring fills the corners
    if (abs(dz) > 2.6) continue;
    float w = exp(-dz * dz);
    acc += w * ringLayer(p, r, fi, u_ringAng[i], u_ringE[i]);
    wsum += w;
  }
  vec3 col = acc / max(wsum, 1e-4);

  // continuous fractal backdrop that ties all rings together
  vec2 z = kaleido(rot(u_time * 0.03) * p, 12.0) * 1.3;
  vec3 bg = vec3(0.0);
  for (int k = 0; k < 5; k++) {
    z = abs(z) / max(dot(z, z), 0.002) - 0.82;
    float l = length(z);
    bg += pal(l * 0.2 + u_hue + r * 0.15) * exp(-l * 2.0);
  }
  return col * 1.25 + bg * (0.1 + u_vol * 0.15);
}

// 1: plasma built from 10 warp layers, one per EQ band.
//    Low bands = large slow swells, high bands = fine shimmer. Each band's phase
//    comes from its ring angle, so the EQ direction toggle reverses that layer's flow.
vec3 modePlasma(vec2 p) {
  vec2 q = p * 1.4;
  float v = 0.0, wsum = 0.0;
  vec3 hi = vec3(0.0);
  for (int i = 0; i < 10; i++) {
    float fi = float(i);
    float e = u_ringE[i];
    float ph = u_ringAng[i];
    float sc = 0.9 * pow(1.3, fi);               // spatial frequency rises with the band
    float th = fi * 2.39996;                     // golden-angle orientation per band
    vec2 d = vec2(cos(th), sin(th));
    vec2 n = vec2(-d.y, d.x);
    float amp = (0.25 + 1.1 * e) / sc;           // louder band = stronger warp
    q += amp * vec2(sin(dot(q, n) * sc + ph), cos(dot(q, d) * sc - ph * 1.3));
    float layer = sin(dot(q, d) * sc * 1.7 + ph * 2.0) * 0.5 + 0.5;
    float w = 0.35 + e;
    v += layer * w;
    wsum += w;
    hi += pal(fi * 0.1 + u_hue + layer * 0.25) * pow(layer, 6.0) * (0.03 + e * 0.35);
  }
  v /= wsum;
  float v2 = smoothstep(0.28, 0.78, v);
  vec3 base = pow(pal(v * 1.5 + u_hue), vec3(1.8)) * (0.05 + 0.95 * v2 * v2);   // saturated, deep shadows
  float contour = smoothstep(0.06, 0.0, abs(fract(v * 5.0 + u_time * 0.05) - 0.5) - 0.42);
  return base * (0.5 + u_vol * 0.6) + pow(hi, vec3(1.3)) * 1.4
       + contour * pow(pal(v + u_hue + 0.5), vec3(1.5)) * (0.08 + u_high * 0.45);
}

// Looks up the EQ band under x (0..1, 10 equal cells).
// Returns (band energy, band index, triangle profile: 0 at cell edge, 1 at the cell's point).
vec3 bandCell(float x) {
  float bpos = clamp(x, 0.0, 0.9999) * 10.0;
  float idx = floor(bpos);
  float e = 0.0;
  for (int i = 0; i < 10; i++) if (float(i) == idx) e = u_ringE[i];
  return vec3(e, idx, 1.0 - abs(fract(bpos) - 0.5) * 2.0);
}

// One star outline whose points are the 10 EQ bands, mirrored per segment.
// sym = mirror segments, R = base radius, reach = how far a fully driven point sticks out.
vec3 bandStar(float r, float a, float sym, float R, float reach, float reverse, float width) {
  float aa = abs(fract(a / TAU * sym) - 0.5) * 2.0;  // 0..1 across half a segment, mirrored
  aa = reverse > 0.5 ? 1.0 - aa : aa;
  vec3 bc = bandCell(aa);
  float e = bc.x, idx = bc.y, tri = bc.z;
  float spike = pow(tri, 1.15);
  float edge = R + (0.025 + reach * e) * spike;
  vec3 cb = pal(idx * 0.1 + u_hue);
  float glow = 0.3 + 1.3 * e;
  float line = smoothstep(width, 0.0, abs(r - edge));
  float fill = smoothstep(edge + 0.004, edge - 0.004, r) * smoothstep(R - 0.1, R, r);
  // a light at the tip of every point, brightness = that band
  float cellArc = TAU / (sym * 20.0) * r;            // angular width of one band cell, as arc length
  float tipR = R + 0.025 + reach * e + 0.035;
  float dotD = length(vec2(r - tipR, (1.0 - tri) * 0.5 * cellArc));
  float tip = smoothstep(0.012 + 0.02 * e, 0.0, dotD);
  return cb * (line * glow * 1.3 + fill * (0.12 + 0.45 * e) * spike) + mix(cb, vec3(1.0), 0.5) * tip * (0.15 + 1.6 * e);
}

// 2: spectrum mandala: two counter-rotating stars whose points are the 10 EQ bands,
//    waveform spokes, petal pattern and a centre glow (the original look, now per band)
vec3 modeMandala(vec2 p) {
  float r = length(p);
  vec2 p1 = rot(u_time * 0.08) * p;
  vec2 p2 = rot(-u_time * 0.06) * p;
  float a1 = atan(p1.y, p1.x), a2 = atan(p2.y, p2.x);

  // inner star: bass at the middle of each petal, highs between; outer star: reversed
  vec3 star1 = bandStar(r, a1, 2.0, 0.22, 0.32, 0.0, 0.022);   // 40 points
  vec3 star2 = bandStar(r, a2, 3.0, 0.72, 0.42, 1.0, 0.022);   // 60 points

  // original-style decoration
  float aa = abs(fract(a1 / TAU * 12.0) - 0.5) * 2.0;
  float eHere = bandCell(abs(fract(a1 / TAU * 2.0) - 0.5) * 2.0).x;
  float w = wave(r * 1.5 - u_time * 0.15);
  float spokes = smoothstep(0.04, 0.0, abs(aa - 0.5 - w * 0.35)) * smoothstep(1.4, 0.1, r);
  float petals = smoothstep(0.0, 0.02, sin(r * 18.0 - u_time * 2.0 + aa * 6.0) * 0.5 + eHere - 0.4) * 0.25;
  float lowE = (u_ringE[0] + u_ringE[1] + u_ringE[2]) / 3.0;
  float glow = (0.2 + lowE) * exp(-r * 2.2) * (0.5 + u_bass);
  vec3 c1 = pal(r - u_time * 0.1 + u_hue + eHere * 0.5);
  vec3 c2 = pal(aa * 0.5 + u_hue + 0.5);

  return star1 * 1.3 + star2 * 1.2 + c1 * (glow + petals * 0.7) + c2 * spokes * 0.3;
}

// 3: tunnel: you fly through rings, and every ring belongs to one EQ band
//    (31 Hz, 63 Hz, ... 16 kHz, then repeating). A ring's band sets its glow, how far
//    its star points stick out, and its twist (from the band's rotation in the EQ panel).
vec3 modeTunnel(vec2 p) {
  p *= rot(u_time * 0.1 + u_bass * 0.2);
  float r = length(p) + 0.001;
  float a = atan(p.y, p.x);
  float z = 0.35 / r + u_time * 0.6;

  float cz = z * 2.0;
  float band = mod(floor(cz), 10.0);
  float fz = fract(cz);                          // position inside this ring's slice
  float e = 0.0, ang = 0.0;
  for (int i = 0; i < 10; i++) if (float(i) == band) { e = u_ringE[i]; ang = u_ringAng[i]; }

  float N = 4.0 + 2.0 * mod(band, 4.0);          // 4, 6, 8 or 10 points per ring
  float aa = a + ang;
  float wob = cos(aa * N) * (0.06 + 0.3 * e);    // star-shaped ring, points grow with the band
  float ring = smoothstep(0.04 + 0.12 * e, 0.0, abs(fz - 0.5 - wob));
  float tip = smoothstep(0.1, 0.0, abs(fz - 0.5 - (0.06 + 0.3 * e))) * pow(max(cos(aa * N), 0.0), 30.0);

  // wall texture between the rings, twisted per band
  float twist = aa * 6.0 + sin(z * 2.0 + u_time) * (1.0 + u_mid * 2.0);
  float wall = smoothstep(-0.1, 0.25, sin(twist) * sin(z * 8.0));

  vec3 cb = pal(band * 0.1 + u_hue);
  vec3 cw = pal(z * 0.15 + u_hue + 0.4);
  float glow = 0.25 + 1.4 * e;
  vec3 col = cb * ring * glow
           + mix(cb, vec3(1.0), 0.5) * tip * (0.2 + 1.8 * e)
           + cw * wall * (0.08 + 0.35 * e);
  return col * smoothstep(0.0, 0.45, r);
}

void main() {
  vec2 p = (gl_FragCoord.xy * 2.0 - u_res) / min(u_res.x, u_res.y);
  p *= 1.0 - u_beat * 0.12;

  // feedback: zoom in, rotate and hue-shift the previous frame
  vec2 c = v_uv - 0.5;
  // less global drift in the ring modes, so each ring's own rotation stays readable
  float fbk = (u_mode < 0.5 || (u_mode > 1.5 && u_mode < 2.5)) ? 0.25 : 1.0;
  c *= rot((0.003 + u_mid * 0.015 * sin(u_time * 0.2)) * fbk);
  c *= 1.0 - (0.015 + u_bass * 0.025) * fbk;
  c += vec2(sin(u_time * 0.7), cos(u_time * 0.53)) * 0.0015;
  vec3 prev = texture2D(u_prev, c + 0.5).rgb;
  // trails slowly drift through the rainbow; with vivid album colours they stay on the cover's colours
  prev = hueShift(prev, (0.03 + u_high * 0.08) * (1.0 - 0.85 * clamp(u_vivid, 0.0, 1.0))) * u_feedback;

  vec3 col;
  if (u_mode < 0.5)      col = modeKaleido(p);
  else if (u_mode < 1.5) col = modePlasma(p);
  else if (u_mode < 2.5) col = modeMandala(p);
  else                   col = modeTunnel(p);

  col *= 0.75 + u_beat * 0.7;
  col = 1.0 - exp(-col * 1.3);           // soft tone map
  float lum = dot(col, vec3(0.299, 0.587, 0.114));
  col = clamp(mix(vec3(lum), col, 1.0 + 0.75 * u_vivid), 0.0, 1.0);   // undo the tone map's washing out

  vec3 outc = max(prev, col) + col * 0.12;
  gl_FragColor = vec4(clamp(outc, 0.0, 1.0), 1.0);
}`;

const OUT_FS = `
precision highp float;
varying vec2 v_uv;
uniform sampler2D u_tex;
uniform sampler2D u_art;
uniform float u_beat, u_artMix, u_artR;
uniform vec2 u_res;
uniform vec3 u_ring;
void main() {
  vec2 uv = v_uv;
  vec2 d = (uv - 0.5) * (0.004 + u_beat * 0.02);
  vec3 c = vec3(texture2D(u_tex, uv + d).r, texture2D(u_tex, uv).g, texture2D(u_tex, uv - d).b);
  float vig = smoothstep(1.25, 0.35, length(uv - 0.5) * 1.4);
  c *= vig;
  if (u_artMix > 0.001) {
    vec2 p = (gl_FragCoord.xy * 2.0 - u_res) / min(u_res.x, u_res.y);
    float r = length(p), R = u_artR * (1.0 + u_beat * 0.035);          // breathes on the beat
    vec2 auv = p / (2.0 * R) + 0.5;
    auv.y = 1.0 - auv.y;
    vec3 art = texture2D(u_art, clamp(auv, 0.0, 1.0)).rgb;
    float inside = smoothstep(R + 0.003, R - 0.003, r);
    float halo = smoothstep(R + 0.12, R, r) * (1.0 - inside);            // soft dark edge around it
    float ring = smoothstep(0.014, 0.0, abs(r - R - 0.014));
    float glow = exp(-max(r - R, 0.0) * 18.0) * (1.0 - inside);
    c = mix(c, c * 0.3, halo * 0.7 * u_artMix);
    c += u_ring * (ring * (0.7 + u_beat) + glow * (0.25 + u_beat * 0.6)) * u_artMix;
    c = mix(c, art, inside * u_artMix);
  }
  gl_FragColor = vec4(c, 1.0);
}`;

function compile(type, src) {
  const s = gl.createShader(type);
  gl.shaderSource(s, src);
  gl.compileShader(s);
  if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) throw new Error(gl.getShaderInfoLog(s));
  return s;
}
function makeProgram(fsSrc) {
  const p = gl.createProgram();
  gl.attachShader(p, compile(gl.VERTEX_SHADER, VS));
  gl.attachShader(p, compile(gl.FRAGMENT_SHADER, fsSrc));
  gl.bindAttribLocation(p, 0, 'a_pos');
  gl.linkProgram(p);
  if (!gl.getProgramParameter(p, gl.LINK_STATUS)) throw new Error(gl.getProgramInfoLog(p));
  const cache = {};
  p.u = name => (name in cache ? cache[name] : (cache[name] = gl.getUniformLocation(p, name)));
  return p;
}

let sceneProg, outProg;
try {
  sceneProg = makeProgram(SCENE_FS);
  outProg = makeProgram(OUT_FS);
} catch (e) {
  console.error(e);
  $('err').style.display = 'grid';
  $('err').textContent = 'Shader kon niet compileren: ' + e.message;
  return;
}

// full-screen triangle
const buf = gl.createBuffer();
gl.bindBuffer(gl.ARRAY_BUFFER, buf);
gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1, -1, 3, -1, -1, 3]), gl.STATIC_DRAW);
gl.enableVertexAttribArray(0);
gl.vertexAttribPointer(0, 2, gl.FLOAT, false, 0, 0);

function makeTex(w, h, format, data) {
  const t = gl.createTexture();
  gl.bindTexture(gl.TEXTURE_2D, t);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
  gl.texImage2D(gl.TEXTURE_2D, 0, format, w, h, 0, format, gl.UNSIGNED_BYTE, data || null);
  return t;
}

// audio texture: row 0 = spectrum (log-ish), row 1 = waveform
const AUDIO_W = 512;
const audioTexData = new Uint8Array(AUDIO_W * 2);
gl.pixelStorei(gl.UNPACK_ALIGNMENT, 1);
const audioTex = makeTex(AUDIO_W, 2, gl.LUMINANCE, audioTexData);

// ping-pong render targets for feedback
let targets = [], cur = 0, W = 0, H = 0;
function makeTarget(w, h) {
  const tex = makeTex(w, h, gl.RGBA, null);
  const fbo = gl.createFramebuffer();
  gl.bindFramebuffer(gl.FRAMEBUFFER, fbo);
  gl.framebufferTexture2D(gl.FRAMEBUFFER, gl.COLOR_ATTACHMENT0, gl.TEXTURE_2D, tex, 0);
  gl.clearColor(0, 0, 0, 1);
  gl.clear(gl.COLOR_BUFFER_BIT);
  return { tex, fbo };
}
function resize() {
  const dpr = Math.min(window.devicePixelRatio || 1, 2) * S.scale;   // render scale from the menu
  const w = Math.max(1, Math.floor(innerWidth * dpr));
  const h = Math.max(1, Math.floor(innerHeight * dpr));
  if (w === W && h === H) return;
  W = w; H = h;
  canvas.width = w; canvas.height = h;
  targets.forEach(t => { gl.deleteTexture(t.tex); gl.deleteFramebuffer(t.fbo); });
  targets = [makeTarget(w, h), makeTarget(w, h)];
  gl.bindFramebuffer(gl.FRAMEBUFFER, null);
}
window.addEventListener('resize', resize);
resize();


// ---------- audio input from the macOS app ----------
// The app sends the same data a Web Audio AnalyserNode would give: byte spectrum (fftSize/2 bins).
const TAU = Math.PI * 2;
const EQ_HZ = [31, 63, 125, 250, 500, 1000, 2000, 4000, 8000, 16000];
const RINGS = EQ_HZ.length;
const rings = EQ_HZ.map((fc, i) => ({
  lo: fc / Math.SQRT2, hi: fc * Math.SQRT2, a: 1, b: 2,
  dir: i % 2 ? -1 : 1, e: 0, ang: Math.random() * TAU, n: { min: 1, max: 0 }
}));
const ringAng = new Float32Array(RINGS), ringE = new Float32Array(RINGS);
const BIN = { b: [1, 7], m: [7, 60], h: [60, 300] };
let sampleRate = 48000, fftSize = 4096, freq = new Uint8Array(2048), lastFeed = -1e9;

function setupBins() {
  const hzBin = hz => Math.max(1, Math.min(freq.length - 1, Math.round(hz / (sampleRate / fftSize))));
  BIN.b = [hzBin(40), hzBin(300)];
  BIN.m = [hzBin(300), hzBin(2500)];
  BIN.h = [hzBin(2500), hzBin(13000)];
  rings.forEach(R => { R.a = hzBin(R.lo); R.b = Math.max(R.a + 1, hzBin(R.hi)); });
}
setupBins();

window.psyInit = o => {
  sampleRate = o.sampleRate || 48000;
  fftSize = o.fftSize || 4096;
  freq = new Uint8Array(fftSize / 2);
  setupBins();
};
window.psyFeed = b64 => {
  const s = atob(b64), n = Math.min(s.length, freq.length);
  for (let i = 0; i < n; i++) freq[i] = s.charCodeAt(i);
  lastFeed = performance.now();
};
window.psySettings = o => {
  const rescale = 'scale' in o && o.scale !== S.scale;
  Object.assign(S, o);
  if (Array.isArray(o.dirs)) rings.forEach((R, i) => { if (o.dirs[i] === 1 || o.dirs[i] === -1) R.dir = o.dirs[i]; });
  if (rescale) { W = 0; resize(); }
  if ('vibrancy' in o && artClusters) paletteFrom(artClusters, S.vibrancy).forEach((c, i) => palAlbum.set(c, i * 3));
  if ('vibrancy' in o || 'custom' in o) applyPalette();
};

// ---------- album art mode ----------
// psyArt(dataURL) shows a cover in the centre and recolours the kaleidoscope with its dominant colours;
// psyArt(null) returns to the rainbow palette. Changes cross-fade.
const artTex = makeTex(1, 1, gl.RGBA, new Uint8Array([0, 0, 0, 255]));
const palCur = new Float32Array(12), palTarget = new Float32Array(12), ringCol = new Float32Array(3);
let artMix = 0, artTarget = 0, palMix = 0, palMixTarget = 0, pendingArt = null, artToken = 0, artClusters = null;
const palAlbum = new Float32Array(12);
let albumActive = false;

// Which colours the kaleidoscope uses: the user's own, the cover's, or the rainbow. Always cross-fades.
function applyPalette() {
  if (Array.isArray(S.custom) && S.custom.length >= 4) {
    for (let i = 0; i < 4; i++) for (let c = 0; c < 3; c++) palTarget[i * 3 + c] = +S.custom[i][c] || 0;
  } else if (albumActive) {
    palTarget.set(palAlbum);
  } else {
    palMixTarget = 0;
    return;
  }
  if (palMix < 0.01) palCur.set(palTarget);       // coming from the rainbow: start on the new colours
  palMixTarget = 1;
}

function rgbToHsl(r, g, b) {
  const mx = Math.max(r, g, b), mn = Math.min(r, g, b), l = (mx + mn) / 2;
  if (mx === mn) return [0, 0, l];
  const d = mx - mn, s = l > 0.5 ? d / (2 - mx - mn) : d / (mx + mn);
  const h = mx === r ? (g - b) / d + (g < b ? 6 : 0) : mx === g ? (b - r) / d + 2 : (r - g) / d + 4;
  return [h / 6, s, l];
}
function hslToRgb(h, s, l) {
  const f = n => { const k = (n + h * 12) % 12, a = s * Math.min(l, 1 - l); return l - a * Math.max(-1, Math.min(k - 3, 9 - k, 1)); };
  return [f(0), f(8), f(4)];
}

// k-means on a 48×48 thumbnail; dominant clusters win, colourful ones get a bonus
function dominantColours(img) {
  const N = 48, cv = document.createElement('canvas');
  cv.width = cv.height = N;
  const g = cv.getContext('2d', { willReadFrequently: true });
  g.drawImage(img, 0, 0, N, N);
  const d = g.getImageData(0, 0, N, N).data, px = [];
  for (let i = 0; i < d.length; i += 4) px.push([d[i] / 255, d[i + 1] / 255, d[i + 2] / 255]);
  const K = 6, cents = [];
  for (let k = 0; k < K; k++) cents.push(px[Math.floor((k + 0.5) / K * px.length)].slice());
  const assign = new Int32Array(px.length);
  for (let it = 0; it < 12; it++) {
    const sum = cents.map(() => [0, 0, 0, 0]);
    px.forEach((c, i) => {
      let best = 0, bd = 1e9;
      cents.forEach((m, k) => { const dd = (c[0] - m[0]) ** 2 + (c[1] - m[1]) ** 2 + (c[2] - m[2]) ** 2; if (dd < bd) { bd = dd; best = k; } });
      assign[i] = best; const s = sum[best]; s[0] += c[0]; s[1] += c[1]; s[2] += c[2]; s[3]++;
    });
    sum.forEach((s, k) => { if (s[3]) cents[k] = [s[0] / s[3], s[1] / s[3], s[2] / s[3]]; });
  }
  const counts = new Array(K).fill(0);
  assign.forEach(k => counts[k]++);
  return cents.map((c, k) => ({ hsl: rgbToHsl(c[0], c[1], c[2]), share: counts[k] / px.length }))
              .filter(c => c.share > 0);
}

// Picks 4 colours and makes them glow. vibrancy 0 = natural; higher values favour small bright
// accents over large dull areas and push saturation/lightness towards pure, luminous colours.
function paletteFrom(clusters, v) {
  const sorted = clusters.map(c => ({ hsl: c.hsl, score: c.share * (0.35 + c.hsl[1] * (1 + 3 * v)) }))
                         .sort((a, b) => b.score - a.score);
  const picked = [];
  for (const c of sorted) {
    const far = picked.every(p => {
      const dh = Math.min(Math.abs(p.hsl[0] - c.hsl[0]), 1 - Math.abs(p.hsl[0] - c.hsl[0]));
      return dh > 0.06 || Math.abs(p.hsl[2] - c.hsl[2]) > 0.25;
    });
    if (far) picked.push(c);
    if (picked.length === 4) break;
  }
  while (picked.length < 4) {                    // few colours: add lighter/darker variants of the main one
    const b = picked[picked.length % Math.max(1, picked.length)] || { hsl: [0.8, 0.5, 0.5] };
    picked.push({ hsl: [b.hsl[0], b.hsl[1], picked.length % 2 ? 0.72 : 0.38] });
  }
  // make them glow: enough saturation (unless the cover is grey) and a mid-to-bright lightness
  const sMin = 0.75 + 0.22 * v, lMin = 0.5 - 0.03 * v, lMax = 0.66 - 0.1 * v;
  return picked.map(({ hsl: [h, s, l] }) =>
    hslToRgb(h, s < 0.08 ? s : Math.min(1, Math.max(s, sMin)), Math.min(lMax, Math.max(lMin, l))));
}

window.psyArt = url => {
  const token = ++artToken;
  if (!url) { pendingArt = null; artTarget = 0; albumActive = false; artClusters = null; applyPalette(); return; }
  const img = new Image();
  img.onload = () => {
    if (token !== artToken) return;
    artClusters = dominantColours(img);
    paletteFrom(artClusters, S.vibrancy).forEach((c, i) => palAlbum.set(c, i * 3));
    albumActive = true;
    applyPalette();
    pendingArt = img;
    artTarget = 0;                                // fade the old cover out, then swap (see frame)
  };
  img.src = url;
};

function stepArt(dt) {
  const k = 1 - Math.exp(-dt * 2.5);
  for (let i = 0; i < 12; i++) palCur[i] += (palTarget[i] - palCur[i]) * k;
  palMix += (palMixTarget - palMix) * k;
  for (let i = 0; i < 3; i++) ringCol[i] = palCur[i];
  if (pendingArt && artMix < 0.02) {
    gl.bindTexture(gl.TEXTURE_2D, artTex);
    gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, gl.RGBA, gl.UNSIGNED_BYTE, pendingArt);
    pendingArt = null;
    artTarget = 1;
  }
  artMix += (artTarget - artMix) * (1 - Math.exp(-dt * 5));
}

// ---------- analysis (same as the visualizer) ----------
const bands = { b: { min: 1, max: 0 }, m: { min: 1, max: 0 }, h: { min: 1, max: 0 } };
let bass = 0, mid = 0, high = 0, vol = 0, beat = 0, bAvg = 0, lastBeat = 0, t = 0, hue = 0, lastColorSwitch = 0;
const avg = (arr, a, b) => { let s = 0; for (let i = a; i < b; i++) s += arr[i]; return s / (b - a); };
function norm(s, v, dt) {
  s.max = Math.max(v, s.max - dt * 0.08);
  s.min = Math.min(v, s.min + dt * 0.08);
  const r = s.max - s.min;
  return r > 0.08 ? (v - s.min) / r : v * 0.5;
}
function follow(curV, target, dt, attack, release) {
  const k = 1 - Math.exp(-dt * (target > curV ? attack : release));
  return curV + (target - curV) * k;
}

function analyse(dt, now) {
  const playing = now - lastFeed < 400;          // no data for a while: let everything settle down
  if (!playing) for (let i = 0; i < freq.length; i++) freq[i] *= 0.9;
  const sens = S.sens;
  const rb = avg(freq, BIN.b[0], BIN.b[1]) / 255;
  const rm = avg(freq, BIN.m[0], BIN.m[1]) / 255;
  const rh = avg(freq, BIN.h[0], BIN.h[1]) / 255;
  const rv = avg(freq, BIN.b[0], BIN.h[1]) / 255;
  const A = S.react;                               // >1 = visuals pick up hits sooner
  bass = follow(bass, Math.min(1, norm(bands.b, rb, dt) * sens), dt, 18 * A, 5);
  mid  = follow(mid,  Math.min(1, norm(bands.m, rm, dt) * sens), dt, 12 * A, 4);
  high = follow(high, Math.min(1, norm(bands.h, rh, dt) * sens), dt, 20 * A, 6);
  vol  = follow(vol,  playing ? Math.min(1, rv * 1.6 * sens) : 0.12, dt, 8 * A, 2);

  bAvg += (rb - bAvg) * (1 - Math.exp(-dt * 1.5));
  if (playing && rb > bAvg * 1.12 + 0.03 / sens && now - lastBeat > 280) {
    beat = 1; lastBeat = now;
    // colour switch: a quarter turn of the palette = the next of the 4 album colours (or a clear rainbow jump)
    if (S.beatColor) { if (now - lastColorSwitch > 350) { hue += 0.25; lastColorSwitch = now; } }
    else hue += 0.04 + Math.random() * 0.04;
  }
  beat *= Math.exp(-dt * 5);
  t += dt * (0.35 + vol * 1.3 + beat * 0.6);
  hue += dt * 0.025;

  for (let i = 0; i < RINGS; i++) {
    const R = rings[i];
    const raw = avg(freq, R.a, R.b) / 255;
    const target = playing ? Math.min(1, norm(R.n, raw, dt) * sens) : 0;
    R.e = follow(R.e, target, dt, 22 * A, 6);
    R.ang = (R.ang + R.dir * S.ringSpeed * (0.06 + 2.6 * R.e * R.e) * dt) % TAU;
    ringAng[i] = R.ang;
    ringE[i] = R.e;
  }
}

// ---------- browser preview: ?demo generates a fake beat ----------
const artParam = new URLSearchParams(location.search).get('art');
if (artParam) setTimeout(() => window.psyArt(artParam), 300);
if (/[?&]demo\b/.test(location.search)) {
  const t0 = performance.now();
  setInterval(() => {
    const s = (performance.now() - t0) / 1000, ph = (s * 2) % 1, kick = Math.exp(-ph * 9), hat = Math.exp(-((ph + 0.5) % 1) * 30);
    const bins = new Uint8Array(2048);
    for (let k = 1; k < bins.length; k++) {
      const hz = k * 48000 / 4096;
      let v = 120 - 12 * Math.log2(hz / 60);
      if (hz < 150) v += 110 * kick;
      if (hz > 300 && hz < 2000) v += 25 * (0.5 + 0.5 * Math.sin(s * 1.3 + hz / 300));
      if (hz > 6000) v += 120 * hat;
      bins[k] = Math.max(0, Math.min(255, v));
    }
    window.psyFeed(btoa(String.fromCharCode.apply(null, bins)));
  }, 1000 / 60);
}

// ---------- Render loop ----------
let last = performance.now();
function frame(now) {
  requestAnimationFrame(frame);
  if (now - last < 1000 / S.maxFps - 2) return;      // frame-rate cap (saves power)
  const dt = Math.min((now - last) / 1000, 0.1);
  last = now;
  analyse(dt, now);
  stepArt(dt);

  gl.activeTexture(gl.TEXTURE1);
  gl.bindTexture(gl.TEXTURE_2D, audioTex);
  gl.texSubImage2D(gl.TEXTURE_2D, 0, 0, 0, AUDIO_W, 2, gl.LUMINANCE, gl.UNSIGNED_BYTE, audioTexData);

  const src = targets[cur], dst = targets[1 - cur];

  // pass 1: scene + feedback into offscreen target
  gl.bindFramebuffer(gl.FRAMEBUFFER, dst.fbo);
  gl.viewport(0, 0, W, H);
  gl.useProgram(sceneProg);
  gl.activeTexture(gl.TEXTURE0);
  gl.bindTexture(gl.TEXTURE_2D, src.tex);
  gl.uniform1i(sceneProg.u('u_prev'), 0);
  gl.uniform1i(sceneProg.u('u_audio'), 1);
  gl.uniform2f(sceneProg.u('u_res'), W, H);
  gl.uniform1f(sceneProg.u('u_time'), t);
  gl.uniform1f(sceneProg.u('u_bass'), bass);
  gl.uniform1f(sceneProg.u('u_mid'), mid);
  gl.uniform1f(sceneProg.u('u_high'), high);
  const kick = S.beatColor ? 0 : beat * S.bounce;   // colour switch replaces the bounce                     // zoom pulse, flash, colour fringe, cover breathing
  gl.uniform1f(sceneProg.u('u_beat'), kick);
  gl.uniform1f(sceneProg.u('u_vol'), vol);
  gl.uniform1f(sceneProg.u('u_mode'), 0);            // kaleidoscope only
  gl.uniform1f(sceneProg.u('u_hue'), hue % 1);
  gl.uniform1f(sceneProg.u('u_feedback'), S.trail);
  gl.uniform1fv(sceneProg.u('u_ringAng[0]'), ringAng);
  gl.uniform1fv(sceneProg.u('u_ringE[0]'), ringE);
  gl.uniform3fv(sceneProg.u('u_palC[0]'), palCur);
  gl.uniform1f(sceneProg.u('u_palMix'), palMix);
  gl.uniform1f(sceneProg.u('u_vivid'), (Array.isArray(S.custom) ? 0.5 : S.vibrancy) * palMix);
  gl.drawArrays(gl.TRIANGLES, 0, 3);

  // pass 2: to screen with chromatic aberration + vignette
  gl.bindFramebuffer(gl.FRAMEBUFFER, null);
  gl.viewport(0, 0, W, H);
  gl.useProgram(outProg);
  gl.activeTexture(gl.TEXTURE0);
  gl.bindTexture(gl.TEXTURE_2D, dst.tex);
  gl.uniform1i(outProg.u('u_tex'), 0);
  gl.uniform1f(outProg.u('u_beat'), kick);
  gl.activeTexture(gl.TEXTURE2);
  gl.bindTexture(gl.TEXTURE_2D, artTex);
  gl.uniform1i(outProg.u('u_art'), 2);
  gl.uniform1f(outProg.u('u_artMix'), artMix);
  gl.uniform1f(outProg.u('u_artR'), 0.25);
  gl.uniform2f(outProg.u('u_res'), W, H);
  gl.uniform3fv(outProg.u('u_ring'), ringCol);
  gl.activeTexture(gl.TEXTURE0);
  gl.drawArrays(gl.TRIANGLES, 0, 3);

  cur = 1 - cur;
}
requestAnimationFrame(frame);
// bridge to the host app: WKWebView on macOS, WebView2 on Windows
const native = (window.webkit && window.webkit.messageHandlers && window.webkit.messageHandlers.ready) ||
  (window.chrome && window.chrome.webview ? { postMessage: m => window.chrome.webview.postMessage(m) } : null);
// GPU took the WebGL context away (driver reset, GPU switch, memory pressure): the app reloads us unseen
canvas.addEventListener('webglcontextlost', e => {
  e.preventDefault();
  if (native) native.postMessage('contextlost'); else setTimeout(() => location.reload(), 500);
});
if (native) native.postMessage('ok');
})();
</script>
</body>
</html>
